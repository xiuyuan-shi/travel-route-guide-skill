<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>@@TITLE@@</title><style>@@CSS@@</style><style>
:root{--ink:#153d50;--muted:#647984;--blue:#256ec6;--line:#dce5e8}*{box-sizing:border-box}body{margin:0;background:#f4f8f9;color:var(--ink);font:15px/1.7 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}main{max-width:820px;padding:0 16px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}.brand{font-weight:700}button,a,input{font:inherit;-webkit-tap-highlight-color:transparent}button{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:9px 13px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:white}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b47722;outline-offset:2px}a{color:var(--blue);text-underline-offset:3px}[hidden]{display:none!important}h1{font:700 31px/1.4 "Songti SC",serif;margin:12px 0}h2{font-size:23px;line-height:1.5;margin:12px 0}h3{font-size:17px;margin:5px 0}.hero{padding:22px;border-radius:18px;background:var(--ink);color:white}.hero p{color:#cce1e5;font-size:13px;margin:8px 0}.eyebrow{font-size:12px;color:#9ed2d4}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{border-radius:20px;background:#e5eef0;padding:4px 9px;font-size:12px}.days{display:flex;overflow:auto;gap:6px;padding:12px 0;position:sticky;top:0;background:#f4f8f9;z-index:800}.days button{flex:1 0 74px;max-width:120px;font-size:12px;white-space:nowrap}.days b{display:block;font-size:16px}.muted{color:var(--muted);font-size:13px}.card,details{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin:12px 0}.card p{color:var(--muted);font-size:14px;margin:6px 0}.time{font-size:12px;color:#187f82}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a,.actions button{font-size:12px;padding:8px 10px;text-decoration:none;min-height:40px;background:#edf4f6;border:0;border-radius:8px}.food{background:#fbf6e9;border-radius:8px;padding:10px;margin:9px 0;font-size:13px;color:#785a2c}.tip{border-left:3px solid #187f82;padding:12px 15px;background:#e7f1f2;margin:16px 0;font-size:13px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tools button{font-size:12px}#map{height:clamp(360px,58dvh,560px);border-radius:14px;background:#eff3ef;border:1px solid var(--line)}.legend{font-size:11px;color:var(--muted);margin:8px 0}.chips{display:flex;overflow:auto;gap:7px;padding:10px 0}.chips button{font-size:12px;white-space:nowrap;border-radius:20px}.pin{border:2px solid white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:white;font:bold 12px system-ui;box-shadow:0 1px 4px #0003}.leaflet-popup-content{font:13px/1.6 system-ui}.leaflet-control-attribution{font-size:8px!important}summary{cursor:pointer;font-weight:600;min-height:32px}details p{white-space:pre-line;font-size:14px;color:var(--muted)}.module-grid,.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:12px}.mini{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfdfd}.mini p{margin:4px 0}.budget-row{display:grid;grid-template-columns:minmax(70px,.7fr) minmax(100px,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.budget-row:last-child{border-bottom:0}.check{display:flex;align-items:flex-start;gap:10px;padding:7px 0}.check input{width:20px;height:20px;flex:0 0 auto;margin-top:3px}.weather-card b{display:block;font-size:16px}.weather-hero{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#ffffff17;color:#e4f4f4;font-size:12px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#168c72;margin-right:7px}footer{font-size:11px;color:var(--muted);padding:16px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:1500}nav button{flex:1;max-width:230px;font-size:13px;border:0}dialog{border:0;border-radius:18px;max-width:440px;width:calc(100% - 28px);padding:24px;color:var(--ink)}dialog::backdrop{background:#153d5077}dialog input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:12px}dialog button{width:100%;margin-top:10px}#status{font-size:12px;color:#187f82}#sources a{display:block;margin:9px 0;font-size:13px}.noscript{margin:20px;max-width:780px}
</style></head><body><noscript><div class="noscript"><h1>@@TITLE@@</h1><p>此模式显示文字日程，互动地图需要启用JavaScript。</p>@@FALLBACK@@</div></noscript><main id="app" hidden><header><span class="brand" id="brand"></span><button id="share">分享攻略</button></header><section id="tripView"><div class="hero" id="hero"></div><div id="weatherHero"></div><div class="tags" id="tags"></div><div class="days" id="days"></div><div id="schedule"></div></section><section id="mapView" hidden><h2>路线地图</h2><p class="muted" id="mapNote"></p><div class="days" id="mapDays"></div><div class="tools"><button id="today">当天路线</button><button id="all">全程路线</button><button id="area" hidden>区域底图范围</button></div><div id="map" role="region" aria-label="旅行路线地图"></div><div class="legend">蓝线 步行 · 青线 公交／乘车 · 虚线 点位连接示意 · 金色 餐厅</div><div class="chips" id="chips"></div><article class="card" id="detail">点标记查看地点与导航。</article></section><section id="infoView" hidden><h2>出行准备</h2><div id="weather"></div><div id="toolkit"></div><div id="info"></div><details><summary>资料来源与地图说明</summary><div id="sources"></div><p>© OpenStreetMap contributors / ODbL（使用OSM数据时）；Leaflet 1.9.4。底图不含实时路况；路线入口、营业与交通以当日情况为准。</p><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">地图数据许可</a></details></section><footer id="footer"></footer></main><nav hidden id="nav"><button data-view="trip" aria-pressed="true">每日行程</button><button data-view="map" aria-pressed="false">路线地图</button><button data-view="info" aria-pressed="false">出行准备</button></nav><dialog id="dialog"><h2>分享这份攻略</h2><p class="muted" id="shareNote"></p><input id="shareUrl" aria-label="分享链接" readonly><button id="nativeShare">系统分享</button><button id="copy">复制链接</button><p id="status" role="status"></p><button id="close">关闭</button></dialog><script>@@JS@@</script><script>
const DATA=@@DATA@@;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let day=0,map,layer,base,scope='day';
function external(u,label){return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`:'';}
function navUrl(k){const p=DATA.places[k];return 'https://uri.amap.com/search?keyword='+encodeURIComponent(p.map_query||DATA.trip.destination+' '+p.name)+'&city='+encodeURIComponent(DATA.trip.destination)+'&view=map';}
function panel(title,body,open=false){return `<details${open?' open':''}><summary>${esc(title)}</summary>${body}</details>`;}
function renderToolkit(){const blocks=[];
if(DATA.lodging?.length)blocks.push(panel('住宿推荐',`<div class="module-grid">${DATA.lodging.map(x=>{const p=DATA.places[x.place_id];return `<article class="mini"><div class="time">${esc(x.label)}</div><h3>${esc(p.name)}</h3><p>${esc(p.address||'')}</p><p><b>${esc(x.price)}</b></p><p>${esc(x.reason)}</p><p class="muted">${esc(x.caveat)}</p><div class="actions">${external(navUrl(x.place_id),'地图导航')}${external(p.source_url,'资料来源')}</div></article>`;}).join('')}</div>`,true));
if(DATA.budget)blocks.push(panel('预算统计',`<p>${esc(DATA.budget.basis)}</p><div class="mini"><h3>${esc(DATA.budget.total_estimate)}</h3><p>${esc(DATA.budget.reserve_note)}</p></div>${DATA.budget.items.map(x=>`<div class="budget-row"><b>${esc(x.label)}</b><div>${esc(x.amount)}<div class="muted">${esc(x.note)}</div></div></div>`).join('')}`,true));
if(DATA.food_quick?.length)blocks.push(panel('美食速查',`<div class="module-grid">${DATA.food_quick.map(x=>{const p=DATA.places[x.place_id];return `<article class="mini"><div class="time">${esc(x.when)}</div><h3>${esc(p.name)}</h3><p>${esc(p.address||'')}</p><p>建议点：${esc(x.order)}</p><p>预算：${esc(x.budget)}</p><p class="muted">备选：${esc(x.fallback)}</p><div class="actions">${external(navUrl(x.place_id),'地图导航')}${external(p.source_url,'资料来源')}</div></article>`;}).join('')}</div>`));
if(DATA.checklist?.length)blocks.push(panel('行前必备清单',DATA.checklist.map((g,gi)=>`<section class="mini"><h3>${esc(g.category)}</h3>${g.items.map((x,ii)=>`<label class="check"><input type="checkbox" data-check="${gi}-${ii}"><span>${esc(x)}</span></label>`).join('')}</section>`).join(''),true));
if(DATA.pitfalls?.length)blocks.push(panel('避坑总结',`<div class="module-grid">${DATA.pitfalls.map(x=>`<article class="mini"><h3>${esc(x.title)}</h3><p>${esc(x.advice)}</p></article>`).join('')}</div>`));
if(DATA.emergencies?.length)blocks.push(panel('应急备用方案',`<div class="module-grid">${DATA.emergencies.map(x=>`<article class="mini"><h3>${esc(x.scenario)}</h3><p>${esc(x.action)}</p></article>`).join('')}</div>`));
$('toolkit').innerHTML=blocks.join('');const key='travel-check:'+DATA.trip.origin+':'+DATA.trip.destination+':'+(DATA.trip.dates||DATA.trip.duration);let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]');}catch{}document.querySelectorAll('[data-check]').forEach(x=>{x.checked=saved.includes(x.dataset.check);x.onchange=()=>{try{localStorage.setItem(key,JSON.stringify([...document.querySelectorAll('[data-check]:checked')].map(y=>y.dataset.check)));}catch{}};});}
const WEATHER_CODES={0:'晴',1:'大致晴',2:'多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'较强毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'较强阵雨',82:'强阵雨',95:'雷雨',96:'雷雨伴冰雹',99:'强雷雨伴冰雹'};
function weatherAdvice(r){const a=[];if((r.rain||0)>=60)a.push('带伞，减少长时间户外');else if((r.rain||0)>=30)a.push('备折叠伞');if((r.gust||r.wind||0)>=45)a.push('避开临水礁石和高处');else if((r.wind||0)>=25)a.push('海边注意防风');if((r.max||0)>=30)a.push('午后防晒补水');if((r.min||99)<=12)a.push('早晚加外套');return a.join('；')||'按原计划，出门前再看预警';}
function localISO(zone){const p=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-');}
function renderWeather(d,cached=false,savedAt=''){const w=DATA.weather,times=d.time||[],rows=times.map((x,i)=>({date:x,code:d.weather_code?.[i],max:d.temperature_2m_max?.[i],min:d.temperature_2m_min?.[i],rain:d.precipitation_probability_max?.[i],wind:d.wind_speed_10m_max?.[i],gust:d.wind_gusts_10m_max?.[i]})).filter(x=>x.date>=w.start_date&&x.date<=w.end_date);if(!rows.length){$('weatherStatus').textContent='当前预报暂未覆盖本次行程，请临近出发时刷新。';return;}$('weatherStatus').innerHTML=`<i class="status-dot"></i>${cached?'缓存预报':'实时预报'} · ${esc(savedAt||new Date().toLocaleString('zh-CN',{hour12:false}))} · 已覆盖 ${rows.length} 天`;$('weatherCards').innerHTML=rows.map(x=>`<article class="mini weather-card"><div class="time">${esc(x.date.slice(5).replace('-','/'))}</div><b>${esc(WEATHER_CODES[x.code]||'天气待判读')} · ${esc(x.min)}–${esc(x.max)}℃</b><p>降雨概率 ${esc(x.rain)}% · 风 ${esc(x.wind)} km/h${x.gust==null?'':` · 阵风 ${esc(x.gust)} km/h`}</p><p>${esc(weatherAdvice(x))}</p></article>`).join('');$('weatherHero').innerHTML=`<div class="weather-hero">天气已更新：${rows.slice(0,2).map(x=>`${x.date.slice(5).replace('-','/')} ${WEATHER_CODES[x.code]||''} ${x.min}–${x.max}℃`).join(' · ')}；完整预报见“出行准备”。</div>`;}
async function loadWeather(){const w=DATA.weather;if(!w)return;$('weather').innerHTML=panel('实时天气与对策',`<p id="weatherStatus"><i class="status-dot"></i>正在获取 ${esc(w.start_date)} 至 ${esc(w.end_date)} 的预报。</p><div id="weatherCards" class="weather-grid"></div><p class="muted">远期预报变化较大，越临近出发越有参考价值；海边和高处还要关注阵风。天气模块需要联网，失败时会明确标注缓存或未获取，不会把气候均值当实时预报。</p><div class="actions">${external(w.official_url,'官方天气／预警')}${external('https://open-meteo.com/en/docs','预报接口说明')}</div>`,true);const today=localISO(w.timezone),limit=new Date(today+'T12:00:00');limit.setDate(limit.getDate()+15);const limitISO=limit.toISOString().slice(0,10);if(w.end_date<today){$('weatherStatus').textContent='行程日期已结束，实时预报不再更新。';return;}if(w.start_date>limitISO){$('weatherStatus').textContent='尚未进入未来 16 日预报范围，请临近出发时刷新。';return;}const qs=new URLSearchParams({latitude:w.lat,longitude:w.lon,daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max',timezone:w.timezone,forecast_days:'16'}),cacheKey='travel-weather:'+w.lat+':'+w.lon+':'+w.start_date,controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch('https://api.open-meteo.com/v1/forecast?'+qs,{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json(),savedAt=new Date().toLocaleString('zh-CN',{hour12:false});renderWeather(j.daily,false,savedAt);try{localStorage.setItem(cacheKey,JSON.stringify({daily:j.daily,savedAt}));}catch{}}catch{let cached;try{cached=JSON.parse(localStorage.getItem(cacheKey)||'null');}catch{}if(cached?.daily)renderWeather(cached.daily,true,cached.savedAt);else $('weatherStatus').textContent='实时天气暂时无法获取，请稍后刷新或打开官方天气／预警。';}finally{clearTimeout(timer);}}
function view(v){['trip','map','info'].forEach(x=>$(x+'View').hidden=x!==v);document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===v));scrollTo(0,0);if(v==='map'){if(!map)initMap();requestAnimationFrame(()=>{map.invalidateSize();draw(scope);});}}
function days(){['days','mapDays'].forEach(id=>{$(id).innerHTML=DATA.days.map((d,i)=>`<button data-day="${i}" aria-pressed="${i===day}"><b>Day ${i+1}</b>${esc(d.date||'第'+(i+1)+'天')}</button>`).join('');});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;days();schedule();if(map)draw('day');});}
function schedule(){const d=DATA.days[day];$('schedule').innerHTML=`<h2>${esc(d.title)}</h2><p class="muted">${esc(d.summary)}</p><button id="seeMap">查看当天路线 ↗</button>`+d.stops.map(s=>{const p=DATA.places[s.place_id];return `<article class="card"><div class="time">${esc(s.time)}</div><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p>${s.food?`<div class="food">${esc(p?.name||'用餐')}<br>${esc(p?.address||'')}<br>建议点：${esc(s.food.menu)}<br>预算：${esc(s.food.budget)}</div>`:''}${p?`<div class="actions"><button data-pin="${esc(s.place_id)}">地图位置</button>${external(navUrl(s.place_id),'地图导航')}${external(p.source_url,'资料来源')}</div>`:''}</article>`;}).join('')+(d.tip?`<div class="tip">${esc(d.tip)}</div>`:'');$('seeMap').onclick=()=>{scope='day';view('map');};document.querySelectorAll('#schedule [data-pin]').forEach(b=>b.onclick=()=>{scope='day';view('map');requestAnimationFrame(()=>focus(b.dataset.pin));});}
function initMap(){map=L.map('map',{scrollWheelZoom:false}).setView([0,0],2);map.attributionControl.setPrefix('Leaflet');layer=L.layerGroup().addTo(map);if(DATA.basemap?.features?.length){base=L.geoJSON(DATA.basemap,{interactive:false,style:f=>({color:f.properties?.kind==='coast'?'#689ea8':f.properties?.kind==='boundary'?'#9daab2':'#cdd6cd',weight:f.properties?.kind==='boundary'?1.5:1,fill: f.properties?.kind==='land',fillColor:'#e6ede3',fillOpacity:1})}).addTo(map);base.bringToBack();$('area').hidden=false;if(DATA.basemap.attribution)map.attributionControl.addAttribution(esc(DATA.basemap.attribution));}L.control.scale({imperial:false}).addTo(map);}
function idsFor(i){const d=DATA.days[i];return [...new Set([...d.stops.map(s=>s.place_id).filter(Boolean),...(d.leg_ids||[]).flatMap(k=>[DATA.legs[k].from,DATA.legs[k].to])])];}
function draw(mode){if(!map)return;scope=mode;layer.clearLayers();const ds=mode==='day'?[day]:DATA.days.map((_,i)=>i);const ids=[...new Set(ds.flatMap(idsFor))];const bounds=[];ds.forEach(i=>(DATA.days[i].leg_ids||[]).forEach(k=>{const l=DATA.legs[k],a=DATA.places[l.from],b=DATA.places[l.to],cs=l.status==='routed'?l.geometry.coordinates.map(p=>[p[1],p[0]]):[[a.lat,a.lon],[b.lat,b.lon]];bounds.push(...cs);L.polyline(cs,{color:'white',weight:6,interactive:false}).addTo(layer);L.polyline(cs,{color:l.mode==='walk'?'#256ec6':'#187f82',weight:3,dashArray:l.status==='routed'?null:'6 6',interactive:false}).addTo(layer);}));ids.forEach((k,i)=>{const p=DATA.places[k];bounds.push([p.lat,p.lon]);L.marker([p.lat,p.lon],{title:p.name,icon:L.divIcon({className:'',html:`<span class="pin" style="background:${p.kind==='food'?'#b47722':'#256ec6'}">${i+1}</span>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(layer).on('click',()=>focus(k));});if(bounds.length)map.fitBounds(bounds,{padding:[32,32],maxZoom:15,animate:false});$('chips').innerHTML=ids.map((k,i)=>`<button data-loc="${esc(k)}">${i+1} ${esc(DATA.places[k].name)}</button>`).join('');document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>focus(b.dataset.loc));$('detail').textContent=ids.length?'点标记或地点名查看导航。':'当天尚未确定可定位的停留点，请先核对交通或住宿。';}
function focus(k){const p=DATA.places[k];map.setView([p.lat,p.lon],15,{animate:false});L.popup().setLatLng([p.lat,p.lon]).setContent(`<b>${esc(p.name)}</b><p>${esc(p.description)}</p>`).openOn(map);$('detail').innerHTML=`<h3>${esc(p.name)}</h3><p>${esc(p.address||'')}</p><p>${esc(p.description)}</p><div class="actions">${external(navUrl(k),'地图导航')}${external(p.source_url,'资料来源')}</div>`;}
const share=DATA.trip.share_url||(/^https?:$/.test(location.protocol)&&!['localhost','127.0.0.1','[::1]'].includes(location.hostname)?location.href.split('#')[0]:'');
$('share').onclick=()=>{$('shareUrl').value=share;$('shareUrl').hidden=!share;$('copy').hidden=!share;$('nativeShare').hidden=!share||!navigator.share;$('status').textContent='';$('shareNote').textContent=share?'将此公开链接发送给朋友。':'尚无公开网址。可把HTML原文件发给朋友，下载后用浏览器打开；需要点击即看的链接时，先发布网页。';$('dialog').showModal();};$('close').onclick=()=>$('dialog').close();$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);$('status').textContent='链接已复制';}catch{$('shareUrl').focus();$('shareUrl').select();$('status').textContent='请长按或手动复制链接';}};$('nativeShare').onclick=async()=>{try{await navigator.share({title:DATA.trip.title||DATA.trip.destination+'旅行攻略',url:share});}catch(e){if(e.name!=='AbortError')$('status').textContent='请改用复制链接';}};
$('brand').textContent=DATA.trip.destination+' · 旅行手册';$('hero').innerHTML=`<div class="eyebrow">${esc(DATA.trip.origin)} → ${esc(DATA.trip.destination)} · ${DATA.trip.duration}天</div><h1>${esc(DATA.trip.title||DATA.trip.destination+'慢游指南')}</h1><p>${esc(DATA.trip.dates||'日期待定 · 按天规划')}</p><p>${esc(DATA.trip.summary||'')}</p>`;$('tags').innerHTML=(DATA.trip.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');$('info').innerHTML=(DATA.sections||[]).map(s=>`<details open><summary>${esc(s.title)}</summary><p>${esc(s.body)}</p></details>`).join('');$('sources').innerHTML=(DATA.sources||[]).map(s=>external(s.url,s.label)).join('');$('footer').textContent='资料核对：'+(DATA.trip.checked_at||'未填写')+' · 时刻、票价与营业以当日实际情况为准';$('mapNote').textContent=DATA.basemap?.features?.length?'已内置地理数据；点标记查看详情。':'点位关系示意：尚无完整底图。虚线不是可导航路径，具体走法请打开地图导航。';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));$('today').onclick=()=>draw('day');$('all').onclick=()=>draw('all');$('area').onclick=()=>{if(base)map.fitBounds(base.getBounds(),{padding:[20,20]});};$('app').hidden=false;$('nav').hidden=false;renderToolkit();days();schedule();loadWeather();
</script></body></html>
